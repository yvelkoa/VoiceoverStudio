name: VoiceoverStudio
options:
  bundleIdPrefix: beav.dev
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  VoiceoverKit:
    path: Packages/VoiceoverKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  VoiceoverStudio:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: VoiceoverKit
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Voiceover Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Voiceover Studio records your voice to lay it over the video.
        NSSpeechRecognitionUsageDescription: Speech recognition turns your takes into captions.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: beav.dev.VoiceoverStudio
        DEVELOPMENT_TEAM: 9ZDSY6TDMN
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
