name: VoiceoverStudio
options:
  bundleIdPrefix: beav.dev
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  VoiceoverKit:
    path: Packages/VoiceoverKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  VoiceoverStudio:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: VoiceoverKit
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Voiceover Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, uk]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: true
        # HTTPS only; answers App Store Connect's export-compliance question up front.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Voiceover Studio records your voice to lay it over the video.
        NSSpeechRecognitionUsageDescription: Speech recognition turns your takes into captions.
        NSPhotoLibraryAddUsageDescription: Voiceover Studio saves your exported videos to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: beav.dev.VoiceoverStudio
        DEVELOPMENT_TEAM: 9ZDSY6TDMN
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  VoiceoverStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: VoiceoverStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: beav.dev.VoiceoverStudioTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoiceoverStudio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VoiceoverStudio
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  VoiceoverStudio:
    build:
      targets:
        VoiceoverStudio: all
        VoiceoverStudioTests: [test]
    test:
      targets: [VoiceoverStudioTests]
      gatherCoverageData: false
