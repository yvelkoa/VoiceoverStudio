name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The newest Xcode on the image: 27 once it ships there, the latest 26.x until then (the app targets iOS 26).
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Unit tests (VoiceoverKit)
        # xcodebuild, not swift test: older toolchains' SwiftPM copies the string catalog instead of compiling it,
        # and the translation test then finds no .lproj in the package bundle.
        working-directory: Packages/VoiceoverKit
        run: xcodebuild test -scheme VoiceoverKit -destination 'platform=macOS' -quiet
      - name: Translations complete
        run: python3 Scripts/fill_strings.py --check
      - name: App tests
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild test \
            -project VoiceoverStudio.xcodeproj \
            -scheme VoiceoverStudio \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
