name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Unit tests (VoiceoverKit)
        run: swift test --package-path Packages/VoiceoverKit
      - name: Translations complete
        run: python3 Scripts/fill_strings.py --check
      - name: App tests
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild test \
            -project VoiceoverStudio.xcodeproj \
            -scheme VoiceoverStudio \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
