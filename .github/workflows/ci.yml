name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The image's default Xcode is older: its SwiftPM copies string catalogs instead of compiling them, so the
      # package's translations go missing. Pick the newest Xcode 27, the version the project is built with.
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then ls -d /Applications/Xcode*.app; echo "No Xcode 27 on this image"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Unit tests (VoiceoverKit)
        run: swift test --package-path Packages/VoiceoverKit
      - name: Translations complete
        run: python3 Scripts/fill_strings.py --check
      - name: App tests
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild test \
            -project VoiceoverStudio.xcodeproj \
            -scheme VoiceoverStudio \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO
