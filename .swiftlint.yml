included:
  - App
  - Packages/VoiceoverKit/Sources
  - Packages/VoiceoverKit/Tests

excluded:
  - Packages/VoiceoverKit/.build

opt_in_rules:
  - closure_spacing
  - contains_over_filter_is_empty
  - empty_count
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
  - trailing_comma   # trailing commas are idiomatic in modern Swift

line_length:
  warning: 130
  ignores_comments: true

identifier_name:
  min_length: 1
  excluded: [id, c, i, x, y]

force_cast: warning
